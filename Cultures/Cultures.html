<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultures</title>
    
    <link rel="stylesheet" href="stylecultures.css">
    <script src="script.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Italiana&family=Modern+Antiqua&family=Nova+Round&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&family=TASA+Explorer:wght@400..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Ephesis&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Membuka Tirai
            setTimeout(() => { document.body.classList.add("page-loaded"); }, 800);

            // Menutup Tirai saat pindah halaman
            const navLinks = document.querySelectorAll("a");
            navLinks.forEach(link => {
                link.addEventListener("click", (e) => {
                    const destination = link.getAttribute("href");
                    if (destination && !destination.startsWith("#") && !destination.startsWith("javascript:") && !link.classList.contains("navbar-toggler") && link.target !== "_blank") {
                        e.preventDefault(); 
                        document.body.classList.remove("page-loaded");
                        setTimeout(() => { window.location.href = destination; }, 1000);
                    }
                });
            });

            // Auto-close Hamburger Menu
            const menuElement = document.getElementById('menuUtama');
            const bsCollapse = new bootstrap.Collapse(menuElement, { toggle: false });
            let statusScrollKebawah = false;

            window.addEventListener('scroll', () => {
                if (menuElement.classList.contains('show') && !statusScrollKebawah) {
                    statusScrollKebawah = true;
                    menuElement.style.opacity = '0';
                    menuElement.style.transform = 'translateY(-10px)';
                    menuElement.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                    setTimeout(() => { bsCollapse.hide(); }, 50);
                }
            });

            menuElement.addEventListener('hidden.bs.collapse', () => {
                menuElement.style.opacity = '';
                menuElement.style.transform = '';
                menuElement.style.transition = '';
                statusScrollKebawah = false;
            });
        });
    </script>

    <style>
        body { margin: 0; padding: 0; }
        
        #transition-curtain { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 99999; pointer-events: none; display: flex; }
        .curtain-side { width: 50%; height: 100%; background-color: #188D47; transition: transform 1.0s cubic-bezier(0.85, 0, 0.15, 1); }
        #page-loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: rgba(255, 255, 255, 0.8); font-family: "Italiana", serif; font-size: 50px; letter-spacing: 6px; z-index: 100000; opacity: 1; transition: opacity 0.4s ease; }
        body.page-loaded #page-loader { opacity: 0; }
        .left-side { transform: translateX(0); }
        .right-side { transform: translateX(0); }
        body.page-loaded .left-side { transform: translateX(-100%); }
        body.page-loaded .right-side { transform: translateX(100%); }

        nav { height: auto; background-color: #188D47; font-family: "Google Sans Flex", sans-serif; }
        .navbar-brand-mobile { padding: 0; display: flex; align-items: center; }
        #logo { height: 60px; width: auto; object-fit: cover; display: block; flex-shrink: 0; }
        #navigasi { display: flex; list-style: none; margin-bottom: 0; padding-left: 0; }
        #navigasi li { width: 100px; height: 60px; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: background-color 0.3s ease; }
        #navigasi li a { text-decoration: none; color: white; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; } 
        #navigasi li:hover { background-color: white; }
        #navigasi li:hover a { color: black; }
        #btn-pass { white-space: nowrap; flex-shrink: 0; height: fit-content; padding: 8px 20px; margin-right: 20px; }

        @media (max-width: 991px) {
            .navbar-brand-mobile { display: flex; width: 100%; height: 60px; justify-content: space-between; align-items: center; padding: 0; background-color: #188D47; }
            #logo { height: 60px; margin-left: 0; }
            .navbar-toggler { margin-right: 15px; }
            .navbar-collapse { background-color: #188D47; padding: 10px 20px 20px 20px; width: 100%; opacity: 0; transform: translateY(-15px); transition: opacity 0.35s ease, transform 0.35s ease; }
            .navbar-collapse.show { opacity: 1; transform: translateY(0); }
            #navigasi { flex-direction: column !important; width: 100% !important; margin-top: 10px !important; margin-left: 0 !important; gap: 8px !important; }
            #navigasi li { width: 100%; height: auto; margin-bottom: 6px; align-items: flex-start; }
            #navigasi li a { justify-content: flex-start; font-size: 18px; padding: 8px 10px; width: 100%; }
            #navigasi li:hover { background-color: rgba(255, 255, 255, 0.15); border-radius: 8px; }
            #navigasi li:hover a { color: white; }
            #btn-pass { margin: 20px 0 10px 0; width: 100%; text-align: center; display: block; padding: 10px 20px; }
        }
    </style>
</head>
<body>
    <div id="transition-curtain">
        <div id="page-loader">LOADING...</div>
        <div class="curtain-side left-side"></div>
        <div class="curtain-side right-side"></div>
    </div>

    <nav class="navbar navbar-expand-lg navbar-dark p-0 sticky-top">
        <div class="container-fluid p-0 d-flex flex-column flex-lg-row align-items-stretch align-items-lg-center">
            <div class="navbar-brand-mobile">
                <a href="#">
                    <img src="../Italy Logo.png" alt="Italy Logo" id="logo">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuUtama" aria-controls="menuUtama" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>

            <div class="collapse navbar-collapse justify-content-between w-100" id="menuUtama">
                <ul id="navigasi" class="navbar-nav mx-lg-auto">
                    <li><a href="../home.html">Home</a></li>
                    <li><a href="../history/history.html">History</a></li>
                    <li><a href="../food/food.html">Foods</a></li>
                    <li><a href="../landmark/landmark.html">Landmarks</a></li>
                    <li><a href="#">Cultures</a></li>
                </ul>
                <a href="https://youtu.be/QDia3e12czc?si=Nk9ryk9EImWdiEaP" class="btn btn-outline-light d-lg-flex align-items-center" id="btn-pass">Get a Tourist Pass</a>
            </div>
        </div>
    </nav>

    <main>
        
    </main>

    <footer>
        
    </footer>
</body>
</html>
